services:
  backend:
    build: ./backend
    container_name: collegehub-backend
    environment:
      PORT: 3000
      JWT_SECRET: collegehub-local-demo-secret
      DB_PATH: /data/collegehub.db
    volumes:
      - collegehub-data:/data
    expose:
      - "3000"
  frontend:
    image: nginx:alpine
    container_name: collegehub-frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
volumes:
  collegehub-data:
