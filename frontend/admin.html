<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CollegeHub | Admin</title><link rel="stylesheet" href="css/style.css"></head><body class="admin">
<header class="nav"><div class="brand">College<span>Hub</span></div><div><span class="badge">PRIVATE ADMIN</span><button id="logout" class="logout hidden">Logout</button></div></header>
<section id="login" class="login"><div class="loginbox"><p class="eyebrow">SECURE ADMINISTRATION</p><h1>Admin Portal</h1><p>Manage student records from the private backend.</p><form id="loginForm"><label>Username<input id="username" value="admin" required></label><label>Password<input id="password" type="password" value="admin123" required></label><button class="btn full">Sign in</button><p id="error" class="error"></p></form></div></section>
<section id="dash" class="dashboard hidden"><div class="dashhead"><div><p class="eyebrow">ADMINISTRATION</p><h1>Dashboard</h1></div><button id="add" class="btn">+ Add Student</button></div><div class="stats adminstats"><div><b id="total">0</b><small>Total Students</small></div><div><b id="cs">0</b><small>Computer Science</small></div><div><b id="active">0</b><small>Active</small></div><div><b>Healthy</b><small>Backend Status</small></div></div>
<div class="tablebox"><div class="toolbar"><h2>Student Records</h2><input id="search" placeholder="Search name, ID or department..."></div><div class="scroll"><table><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Department</th><th>Year</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></div></section>
<div id="modal" class="modal hidden"><div class="modalbox"><button id="close" class="close">×</button><p class="eyebrow">STUDENT MANAGEMENT</p><h2 id="mtitle">Add Student</h2><form id="studentForm"><input type="hidden" id="sid"><label>Student ID<input id="scode" required></label><label>Full Name<input id="sname" required></label><label>Email<input id="semail" type="email" required></label><label>Department<select id="sdept"><option>Computer Science</option><option>Information Technology</option><option>Electronics</option><option>Business Administration</option></select></label><label>Year<select id="syear"><option>1</option><option>2</option><option>3</option><option>4</option></select></label><label>Status<select id="sstatus"><option>Active</option><option>Inactive</option></select></label><button class="btn full">Save Student</button></form></div></div>
<script src="js/admin.js"></script></body></html>
